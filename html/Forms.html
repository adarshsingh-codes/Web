<!--All related to forms Complete-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>We are learning HTML FORMS</h2>
    <form>
    <label for="name">Enter your name: </label>
    <input type="text" id="name" placeholder="Enter your Name" minlength="3" maxlength="15"><br>
    <fieldset>
        <legend>Enter your age</legend>
    <input type="number" placeholder="Enter your age" required>
    </fieldset>
    <br>
    <label for="mail">ENter your email</label>
    <br>
    <input type="email" id="mail" required>
    <br>
    <br>
    <label for="pass">ENter your password</label>
    <br>
    <input type="password" id="pass" required><br>
    <br>
    <label>Enter your phone number</label>
    <input type="tel"><br>
    <label>Enter url</label><br>
    <input type="url"><br>
    <label>Select your gender</label><br>
    <input type="radio" name="gender" value="male">male<br>
    <input type="radio" name="gender" value="female">female<br>
    <input type="radio" name="gender" value="others">others<br>
    <label>Select your Hobbies</label><br>
    <input type="checkbox" name="hobby" value="cricket">Cricket<br>
    <input type="checkbox" name="hobby" value="Football">Footbaal<br>
    <input type="checkbox" name="hobby" value="tennnis">Tennis<br> 
    <fieldset>
        <legend>Comments</legend>
        <textarea placeholder="Enter comments..." rows="3" cols="30"></textarea>
    </fieldset> 
    <fieldset>
        <legend >Date and time</legend>
        <input type="time"><br>
        <label>Date</label><br>
        <input type="date"><br>
    </fieldset>
    <br>
    <select>
        <option value=""disabled selected hidden></option>
        <option>option 1</option>
        <option>option 2</option>
        <option>option 3</option>
    </select>
    <br>
    <label for="files">click your file</label>
    <input type="file" required>
    <br>
    <label>Rating</label><br>
    <input type="range" max="10" min="0">

    <br><button type="submit">Submit</button>
    </form>
</body>
</html>
