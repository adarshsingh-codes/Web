<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body class="bg-black">
    <div class="bg-black">
        <h1 id="title" class="heading">DOM learning on CHai 
            and Code <span style="display: none;">test text</span></h1>

        <h2>Lorem ipsum dolor sit amet.</h2>

            <li class="list-item">two</li>
            <li class="list-item">three</li>
            <li class="list-item">four</li>
        </ul>
    </div>

    <script>
        const heading=document.getElementsByClassName('list-item')
        //this gives a HTMLcollection and not a nodelist//major difference

        //for each doesnt work here

        //html collection ko convert krna padega

        Array.from(heading)  //converts the htmlcllection to array

        const myconvertedarray=Array.from(heading)
        myconvertedarray.forEach((li)=>{
            li.style.color='orange'
        })

        console.log(heading)
    </script>

<script>
